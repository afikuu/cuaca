<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web cuaca </title>
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <nav class="navbar">
        <h1 class="text">SELAMAT DATANG DI WEB CUACA BETA BY AFIKUU </h1>
    </nav>
    <section>
        <input id="input" type="text" placeholder="Masukkan nama kota, contoh: Jakarta" />
        <button id="button">CARI</button>

        <div id="tabel">

            <div class="bagianatas">
                <div id="kota">Nama Kota/Negara</div>
            </div>
            <div class="bagiantengah">
                <div  id="cuaca">CUACA</div>
                <img id="icon"  />
            </div>
            <div id="container" class="bagianbawah">
            <div class="card" id="suhu">suhu</div>
            <div class="card" id="kelembapan">kelembapan</div>
            <div class="card" id="kecepatan">kecepatan angin</div>
            <div class="card" id="tekanan">tekanan</div>
            </div>
        </div>
    </section>
</body>
<script type="text/javascript" src="script.js"></script>

</html>
